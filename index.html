<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crypto Pulse — Premium Market Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <div class="bg-aurora" aria-hidden="true"></div>

  <header class="dashboard-header">
    <div class="header-left">
      <h1>Crypto <span class="accent">Pulse</span></h1>
      <p class="subtitle">Premium Market Terminal</p>
    </div>
    <div class="header-right">
      <span class="status-dot" id="status-dot" aria-hidden="true"></span>
      <button id="refresh-btn" class="refresh-btn" type="button" aria-label="Refresh prices">
        <svg class="refresh-icon" viewBox="0 0 24 24" width="15" height="15" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-2.64-6.36" />
          <path d="M21 3v6h-6" />
        </svg>
        Refresh
      </button>
    </div>
  </header>

  <section class="metrics-bar" aria-label="Aggregate market metrics">
    <div class="metric-card">
      <span class="metric-label">Total Market Cap</span>
      <span class="metric-value" id="market-cap">—</span>
    </div>
    <div class="metric-card">
      <span class="metric-label">24h Volume</span>
      <span class="metric-value" id="volume">—</span>
    </div>
  </section>

  <div class="error-banner hidden" id="error-banner" role="alert" aria-live="assertive">
    <span class="error-icon" aria-hidden="true">⚠</span>
    <span class="error-text" id="error-text">Something went wrong while loading prices.</span>
    <button id="retry-btn" class="retry-btn" type="button">Retry now</button>
    <button id="dismiss-error" class="dismiss-btn" type="button" aria-label="Dismiss error">✕</button>
  </div>

  <div class="search-row">
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7" />
        <path d="M20 20l-3.5-3.5" />
      </svg>
      <input id="search-input" type="search" placeholder="Search BTC, ETH, SOL, DOGE…" autocomplete="off" aria-label="Search coins" />
    </div>
    <span class="result-count" id="result-count" aria-live="polite"></span>
  </div>

  <main class="dashboard-grid" id="coin-grid"><!-- cards rendered by script.js --></main>

  <div class="empty-state hidden" id="empty-state">
    <div class="empty-icon">⌕</div>
    <p class="empty-title">No coins match "<span id="empty-query"></span>"</p>
    <p class="empty-hint">Try BTC, ETH, SOL, DOGE…</p>
  </div>

  <!-- Coin detail modal -->
  <div class="modal-root" id="modal-root" role="dialog" aria-modal="true" aria-labelledby="modal-name" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-panel">
      <button class="modal-close" type="button" data-close-modal aria-label="Close details">✕</button>

      <header class="modal-head">
        <div class="modal-coin">
          <div class="coin-icon modal-logo" id="modal-logo-wrap">
            <span class="icon-fallback" id="modal-fallback">?</span>
            <img id="modal-logo" alt="" />
          </div>
          <div class="modal-title">
            <h2 id="modal-name">—</h2>
            <span class="modal-symbol" id="modal-symbol">—</span>
          </div>
        </div>
        <div class="modal-price-block">
          <div class="modal-price" id="modal-price">—</div>
          <span class="coin-change change-neutral" id="modal-change">—%</span>
        </div>
      </header>

      <section class="modal-chart-section">
        <div class="chart-header">
          <span class="metric-label">7-Day Price Chart</span>
          <span class="chart-range" id="chart-range">—</span>
  	</div>
        <div class="chart-wrap" id="chart-wrap">
          <svg id="modal-chart" viewBox="0 0 600 220" preserveAspectRatio="none">
            <defs>
              <linearGradient id="chart-fill" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#c9a962" stop-opacity="0.22" />
                <stop offset="100%" stop-color="#c9a962" stop-opacity="0" />
              </linearGradient>
            </defs>
            <g class="chart-grid" aria-hidden="true"></g>
            <path class="chart-area" id="chart-area" d="" fill="url(#chart-fill)"></path>
            <path class="chart-line" id="chart-line" d=""></path>
            <line class="chart-crosshair" id="chart-crosshair" y1="0" y2="220" x1="0" x2="0" opacity="0"></line>
            <circle class="chart-dot" id="chart-dot" r="4" opacity="0"></circle>
          </svg>
          <div class="chart-tooltip" id="chart-tooltip" hidden>
            <span class="tt-price" id="tt-price"></span>
            <span class="tt-date" id="tt-date"></span>
          </div>
        </div>
      </section>

      <section class="modal-stats">
        <div class="stat"><span class="stat-label">Market Cap</span><span class="stat-value" id="stat-cap">—</span></div>
        <div class="stat"><span class="stat-label">24h Volume</span><span class="stat-value" id="stat-vol">—</span></div>
        <div class="stat"><span class="stat-label">All-Time High</span><span class="stat-value" id="stat-ath">—</span></div>
        <div class="stat"><span class="stat-label">ATH Date</span><span class="stat-value" id="stat-ath-date">—</span></div>
        <div class="stat"><span class="stat-label">All-Time Low</span><span class="stat-value" id="stat-atl">—</span></div>
        <div class="stat"><span class="stat-label">Circulating Supply</span><span class="stat-value" id="stat-supply">—</span></div>
        <div class="stat"><span class="stat-label">Rank</span><span class="stat-value" id="stat-rank">—</span></div>
        <div class="stat"><span class="stat-label">Last Updated</span><span class="stat-value" id="stat-updated">—</span></div>
      </section>
    </div>
  </div>
</body>
</html>
